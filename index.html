<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">Classic Snake</p>
          <h1>Snake</h1>
          <p class="sub">Grow, avoid walls and yourself, and beat your score.</p>
        </div>
        <div class="scoreboard">
          <div class="score">
            <span class="label">Score</span>
            <span id="score">0</span>
          </div>
          <div class="score">
            <span class="label">Best</span>
            <span id="bestScore">0</span>
          </div>
        </div>
      </header>

      <section class="game">
        <div class="board" id="board" aria-label="Snake board" role="application"></div>
        <aside class="controls">
          <div class="status" id="status">Press an arrow key to start.</div>
          <div class="buttons">
            <button id="restartBtn" type="button">Restart</button>
            <button id="pauseBtn" type="button">Pause</button>
          </div>
          <div class="hint">
            Use arrow keys or WASD. Pause with P or Space.
          </div>
        </aside>
      </section>

      <section class="pad" aria-label="On-screen controls">
        <div class="pad-row">
          <button class="pad-btn" data-dir="up" aria-label="Move up">▲</button>
        </div>
        <div class="pad-row">
          <button class="pad-btn" data-dir="left" aria-label="Move left">◀</button>
          <button class="pad-btn" data-dir="down" aria-label="Move down">▼</button>
          <button class="pad-btn" data-dir="right" aria-label="Move right">▶</button>
        </div>
      </section>
    </main>

    <script src="logic.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
