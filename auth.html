<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In | BoredLabs</title>
    <link rel="stylesheet" href="style.css?v=1.2.1" />
  </head>
  <body class="request-page">
    <header class="topbar solid">
      <div class="brand">
        <img class="brand-logo" src="bicon.png" alt="BoredLabs logo" />
        <div>
          <p class="eyebrow">Defeat Boredom</p>
          <h1 class="brand-title">BoredLabs</h1>
        </div>
      </div>
      <div class="top-actions">
        <a class="pill ghost" href="index.html">Home</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="request-hero">
        <div>
          <h2>Log In to Continue</h2>
          <p class="muted">Create an account or log in to access full blueprint details.</p>
        </div>
        <div class="request-card">
          <form id="authForm" class="form compact">
            <label>
              Email <span class="req">*</span>
              <input name="email" type="email" required />
            </label>
            <label>
              Password <span class="req">*</span>
              <input name="password" type="password" required />
            </label>
          <div class="admin-actions">
            <button class="pill primary" type="submit">Log In</button>
            <button id="signupBtn" class="pill" type="button">Sign Up</button>
          </div>
          <button id="resetBtn" class="pill ghost" type="button">Forgot password?</button>
        </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Contact: jdingle@atomicmail.io</p>
    </footer>

    <script type="module" src="auth.js?v=1.2.1"></script>
  </body>
</html>
