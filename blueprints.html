<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blueprints | BoredLabs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="blueprints-page">
    <div class="sticker-layer" aria-hidden="true">
      <span class="sticker sticker-a"></span>
      <span class="sticker sticker-b"></span>
      <span class="sticker sticker-c"></span>
    </div>

    <header class="topbar solid">
      <div class="brand">
        <img class="brand-logo" src="bicon.png" alt="BoredLabs logo" />
        <div>
          <p class="eyebrow">Defeat Boredom</p>
          <h1 class="brand-title">BoredLabs</h1>
        </div>
      </div>
      <div class="top-actions">
        <a class="pill ghost" href="index.html">Home</a>
        <a class="pill" href="request.html">Request Blueprint</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="list-head">
        <div>
          <h2>Blueprint Library</h2>
          <p class="muted">Browse every blueprint in a clean App Store list view.</p>
        </div>
        <div class="filters">
          <button id="showAllBtn" class="pill ghost" type="button">All</button>
          <button id="bestRatedBtn" class="pill ghost" type="button">Best Rated</button>
        </div>
      </section>

      <section id="blueprintList" class="app-list"></section>
    </main>

    <section id="detailModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="closeDetailBtn" class="icon-btn" type="button" aria-label="Close detail">&times;</button>
        <div id="detailContent"></div>
      </div>
    </section>

    <footer class="footer">
      <p>Contact: jdingle@atomicmail.io</p>
    </footer>

    <script type="module" src="blueprints.js"></script>
  </body>
</html>
